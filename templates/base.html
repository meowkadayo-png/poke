<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}寶可夢圖鑑｜Pokédex{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('index') }}">Pokédex 圖鑑</a>
      <form class="search-form" action="{{ url_for('search') }}" method="get">
        <input
          type="search"
          name="q"
          placeholder="輸入英文名稱或編號（如 pikachu、25）"
          aria-label="搜尋寶可夢英文名稱或編號"
          required
        >
        <button type="submit">搜尋</button>
      </form>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
